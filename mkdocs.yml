site_name: ds
site_description: Run dev scripts from your project's existing config file
site_url: https://docs.metaist.com/ds/
repo_url: https://github.com/metaist/ds
repo_name: metaist/ds

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tasks: tasks.md
  - Workspaces: workspaces.md
  - CLI Reference: cli.md
  - CI/CD: ci-cd.md
  - Limitations: limitations.md
  - Inspirations: inspirations.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

docs_dir: docs
site_dir: site
